<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cite2Site</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; font-size: 13px; color: #333; }
    .header { padding: 12px 12px 0; }
    .header h2 { margin: 0; font-size: 15px; }
    .drop-zone { margin: 12px; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; color: #888; cursor: pointer; transition: border-color .2s; font-size: 12px; }
    .drop-zone:hover { border-color: #1976d2; color: #1976d2; }
    .drop-zone.has-file { border-color: #2e7d32; color: #2e7d32; }
    #viewer { margin: 0 12px 12px; max-height: 240px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; display: none; }
    #content { padding: 8px; white-space: pre-wrap; font-family: monospace; font-size: 12px; user-select: text; line-height: 1.4; }
    .toolbar { display: none; margin: 0 12px 8px; gap: 6px; align-items: center; }
    .toolbar.visible { display: flex; }
    button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; }
    button.primary { background: #1976d2; color: #fff; border-color: #1976d2; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: #888; font-size: 11px; flex: 1; }
    .result { margin: 0 12px 12px; padding: 8px; border-radius: 4px; display: none; font-size: 12px; }
    .result.ok { background: #e8f5e9; display: block; }
    .result.err { background: #ffebee; color: #c62828; display: block; }
    .result code { font-size: 11px; word-break: break-all; }
    .hidden { display: none !important; }
    .hint { margin: 12px; color: #888; font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header"><h2>Cite2Site</h2></div>
  <div id="hint" class="hint">Drop a text or Markdown file here, or select text on any page and right-click → <b>Cite with Cite2Site</b>.</div>

  <div id="dropZone" class="drop-zone hidden">
    <strong>Drop a file here</strong><br>
    <small>or click to browse. Text & Markdown only.</small>
  </div>
  <input type="file" id="fileInput" class="hidden" accept=".txt,.md,.markdown,.csv,.py,.js,.ts,.html,.css,.json,.xml,.yaml,.yml,.log">

  <div id="viewer"><div id="content"></div></div>
  <div class="toolbar" id="toolbar">
    <button id="citeBtn" class="primary" disabled>Cite selection</button>
    <button id="lookupBtn" disabled>Look up at cursor</button>
    <span id="status"></span>
  </div>
  <div id="result" class="result"></div>

  <script src="popup.js"></script>
</body>
</html>
