<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cite2Site</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 400px; font-family: system-ui, sans-serif; margin: 0; padding: 0; font-size: 13px; }
    .drop-zone {
      margin: 12px; padding: 24px; border: 2px dashed #ccc; border-radius: 8px;
      text-align: center; color: #888; cursor: pointer; transition: border-color .2s;
    }
    .drop-zone.dragover { border-color: #1976d2; color: #1976d2; }
    .drop-zone.has-file { border-color: #2e7d32; color: #2e7d32; }
    #viewer { margin: 0 12px 12px; max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; display: none; }
    #content { padding: 8px; white-space: pre-wrap; font-family: monospace; font-size: 12px; user-select: text; }
    .toolbar { display: none; margin: 0 12px 8px; gap: 6px; }
    .toolbar.visible { display: flex; }
    button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    button.primary { background: #1976d2; color: #fff; border-color: #1976d2; }
    button:disabled { opacity: .5; cursor: default; }
    #result { margin: 12px; padding: 8px; border-radius: 4px; display: none; font-size: 11px; }
    #result.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    #result.err { background: #ffebee; color: #c62828; display: block; }
    #status { margin: 0 12px 8px; color: #888; font-size: 11px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="dropZone" class="drop-zone">
    <strong>Drop a file here</strong><br>
    <small>or click to browse. Text & Markdown supported.</small>
  </div>
  <input type="file" id="fileInput" class="hidden" accept=".txt,.md,.markdown,.csv,.py,.js,.ts,.html,.css,.json,.xml,.yaml,.yml,.log">

  <div id="viewer">
    <div id="content"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <button id="citeBtn" class="primary" disabled>Cite selection</button>
    <button id="lookupBtn" disabled>Look up at cursor</button>
    <span id="status"></span>
  </div>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
