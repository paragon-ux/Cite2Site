<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cite2Site</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px;
      font-size: 13px; color: #333;
    }
    h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    p.desc { margin: 0 0 12px; color: #666; font-size: 12px; line-height: 1.4; }
    .result { padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; word-break: break-all; }
    .result.ok { background: #e8f5e9; border: 1px solid #c8e6c9; }
    .result.err { background: #ffebee; border: 1px solid #ffcdd2; }
    .result.waiting { background: #f5f5f5; border: 1px solid #e0e0e0; color: #999; }
    code { font-family: "SF Mono", "Consolas", "Liberation Mono", monospace; font-size: 11px; }
  </style>
</head>
<body>
  <h2>Cite2Site</h2>
  <p class="desc">Select text on any page, right-click, and choose <b>Cite with Cite2Site</b>. The citation is recorded in your local <code>.c2s</code> repository.</p>
  <div id="result" class="result waiting">Ready — select text and right-click to cite.</div>
  <script src="popup.js"></script>
</body>
</html>
