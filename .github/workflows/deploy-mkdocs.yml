# Deploy Cite2Site-generated documentation site to GitHub Pages using
# MkDocs Material theme.
#
# This workflow:
# 1. Checks out the repository.
# 2. Exports the citation site via `c2s export`.
# 3. Patches the generated mkdocs.yml with the Material theme.
# 4. Builds the MkDocs site.
# 5. Deploys to GitHub Pages.
#
# Generated `.c2s/exports/` and `.c2s/site/` are projections — they can be
# regenerated at any time from the authority files in `.c2s/`.

name: Deploy MkDocs Site

on:
  push:
    branches: [main, codex/first-build-slice]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cite2Site
        run: pip install -e .

      - name: Export citation site
        run: c2s export

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Apply Material theme to generated mkdocs.yml
        run: |
          python -c "
          import re
          path = '.c2s/site/mkdocs.yml'
          with open(path) as f:
              content = f.read()
          theme_block = '''theme:
            name: material
            features:
              - navigation.tabs
              - navigation.indexes
              - content.code.copy
            palette:
              - scheme: default
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          '''
          content = re.sub(
              r'(site_name:.*\n)',
              r'\1\n' + theme_block + '\n',
              content,
              count=1,
          )
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build MkDocs site
        working-directory: .c2s/site
        run: python -m mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .c2s/site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
