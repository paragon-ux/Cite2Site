# Build and deploy the official Cite2Site documentation site using
# MkDocs Material theme. The docs live in `build-docs/` and this
# workflow is the authoritative publication path for the project's
# own documentation.
#
# Steps:
# 1. Validate the Cite2Site tool itself (c2s check + unit tests).
# 2. Build the MkDocs Material site from `build-docs/`.
# 3. Deploy to GitHub Pages.

name: Deploy Documentation Site

on:
  push:
    branches: [main, codex/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cite2Site
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate citation engine
        run: python -m compileall src && c2s --help

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build documentation site
        working-directory: build-docs
        run: python -m mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
