[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cite2site"
version = "2.0.0a1"
description = "Replacement-protocol source-clean citations with operation replay, groups, handles, scoped duplicates, and deterministic reconciliation."
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Cite2Site contributors"}]
keywords = ["citations", "evidence", "verification", "source-clean", "append-only", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/paragon-ux/Cite2Site"
Documentation = "https://paragon-ux.github.io/Cite2Site/"
Repository = "https://github.com/paragon-ux/Cite2Site"

[project.scripts]
c2s = "c2s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
